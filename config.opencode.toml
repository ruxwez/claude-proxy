# claude-proxy — configuración para los modelos GRATUITOS de OpenCode Zen.
#
# Cómo obtener la key:
#   1. Entra en https://opencode.ai/auth, crea cuenta y copia tu API key de Zen.
#   2. Expónla como variable de entorno:
#        $env:OPENCODE_API_KEY = "..."   (PowerShell)
#        export OPENCODE_API_KEY="..."    (bash)
#   3. Arranca: go run ./cmd/server --config config.opencode.toml
#
# Verificado contra GET https://opencode.ai/zen/v1/models (09/10/2026).
# Todos son "Free" por tiempo limitado según https://opencode.ai/docs/zen/#pricing.
# Privacidad: durante el periodo gratuito algunos proveedores pueden usar los
# datos para mejorar el modelo (big-pickle, exo, mimo, ling, nemotron).
# Excepciones zero-retention: space-bunny-free, longcat-2.5-preview-free,
# step-5-preview-free. Muse Spark Contributor usa tus prompts para entrenar.
#
# No incluido: jev-1.13-free (endpoint /systemone, no es un chat: no admite
# el estándar Anthropic Messages y queda fuera del alcance de este proxy).

[server]
host = "0.0.0.0"
port = 8080
# auth_token = "sk-proxy-secreto"  # opcional: protege tu proxy local

# Por defecto: cualquier otro modelo *-free futuro va a Zen tal cual.
[default]
provider = "opencode"
target_model = "*"
base_url = "https://opencode.ai/zen/v1"
api_key_env = "OPENCODE_API_KEY"
timeout_seconds = 120

# --- Chat Completions (provider "opencode") ---

