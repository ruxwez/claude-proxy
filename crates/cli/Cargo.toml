[package]
name = "claude-proxy-cli"
description = "Terminal interface and local service installer for Claude Proxy"
repository = "https://github.com/ruxwez/claude-proxy"
readme = "../../README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "claude-proxy"
path = "src/main.rs"

[dependencies]
claude-proxy-service = { path = "../service", version = "=0.2.1" }
rpassword = "7"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "vendored", "crypto-rust"] }
sha2 = "0.10"
semver = "1"
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
crossterm = "0.29"
directories = "6"
webbrowser = "1"
anyhow.workspace = true
clap.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
uuid.workspace = true
tempfile.workspace = true

axum = "0.8"
