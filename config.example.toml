[server]
host = "0.0.0.0"
port = 8080
# Descomenta para exigir token a los clientes (x-api-key o Authorization: Bearer).
# auth_token = "sk-proxy-secreto"

[default]
provider = "openai"
target_model = "gpt-4o-mini"
base_url = "https://api.openai.com/v1"
api_key_env = "OPENAI_API_KEY"
timeout_seconds = 120

[[routes]]
anthropic_model = "claude-3-5-sonnet-20241022"
provider = "openai"
target_model = "gpt-4o-mini"
base_url = "https://api.openai.com/v1"
api_key_env = "OPENAI_API_KEY"
timeout_seconds = 120

[[routes]]
anthropic_model = "claude-3-5-haiku-*"
provider = "openai"
target_model = "gpt-4o-mini"
base_url = "https://api.openai.com/v1"
api_key_env = "OPENAI_API_KEY"
timeout_seconds = 120

[[routes]]
anthropic_model = "claude-3-opus-*"
provider = "openai"
target_model = "gpt-4o"
base_url = "https://api.openai.com/v1"
api_key_env = "OPENAI_API_KEY"
timeout_seconds = 120

