services:
  claude-proxy:
    build:
      context: .
      target: proxy
    image: claude-proxy:rust
    container_name: claude-proxy
    restart: unless-stopped
    command: ["--host", "0.0.0.0", "--database", "/data/proxy.sqlite3"]
    ports:
      - "127.0.0.1:10800:10800"
      - "127.0.0.1:10801:10801"
    volumes:
      - proxy-data:/data
    init: true
    stop_grace_period: 20s
volumes:
  proxy-data:
