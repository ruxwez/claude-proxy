services:
  claude-proxy:
    build:
      context: .
      target: proxy
    image: claude-proxy:rust
    restart: unless-stopped
    environment:
      PROXY_HOST: 0.0.0.0
      PROXY_CONFIG_DIR: /data
      PROXY_PORT: 10800
      PROXY_ADMIN_PORT: 10801
      PROXY_ADMIN_HOST: ${PROXY_ADMIN_HOST:-}
      # Empty optional variables are omitted; an empty AUTH_KEY is rejected.
    env_file:
      - path: .env
        required: false
    ports:
      # The gateway also serves /api/*: one public port is sufficient.
      - "${PROXY_BIND_ADDRESS:-127.0.0.1}:${PROXY_EXPOSE_PORT:-10800}:10800"
    volumes:
      - proxy-data:/data
    init: true
    stop_grace_period: 20s
volumes:
  proxy-data:
