name: Verify
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo build --workspace --locked
      - run: python scripts/verify_architecture.py --bin-dir target/debug
      - run: python scripts/verify_service.py --bin-dir target/debug
      - if: runner.os != 'Windows'
        run: python3 scripts/verify_tui.py --bin-dir target/debug
  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: proxy
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 20
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: test-only
          MYSQL_DATABASE: proxy
        ports: ["3306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -ptest-only" --health-interval 5s
          --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.96.0
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - run: cargo test -p claude-proxy-server --locked remote_database_roundtrips -- --ignored
        env:
          PROXY_TEST_POSTGRES: postgres://postgres:test-only@127.0.0.1:5432/proxy
          PROXY_TEST_MYSQL: mysql://root:test-only@127.0.0.1:3306/proxy
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - run: docker compose up -d --build --wait
      - run: curl --fail http://127.0.0.1:10800/health
      - run: curl --fail http://127.0.0.1:10800/api/status
      - if: always()
        run: docker compose down -v
