name: Tests
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
permissions:
  contents: read
env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: '1'
jobs:
  test:
    name: Tests and native integration (${{ matrix.os }})
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Test release packaging without publishing
        run: python -m unittest discover -s scripts -p 'test_release.py'
      - name: Check Rust formatting
        run: cargo fmt --all -- --check
      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Run workspace tests with local provider fixtures
        run: cargo test --workspace --locked
      - name: Build CLI and server for integration tests
        run: cargo build --workspace --locked
      - name: Test CLI and server against a simulated provider
        run: python scripts/verify_architecture.py --bin-dir target/debug
      - name: Test native service installation and lifecycle
        run: python scripts/verify_service.py --bin-dir target/debug
      - name: Test interactive terminal interface
        if: runner.os != 'Windows'
        run: python3 scripts/verify_tui.py --bin-dir target/debug
  database:
    name: PostgreSQL and MySQL integration
    timeout-minutes: 30
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: proxy
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 20
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: test-only
          MYSQL_DATABASE: proxy
        ports: ["3306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -ptest-only" --health-interval 5s
          --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.96.0
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Test disposable PostgreSQL and MySQL databases
        run: cargo test -p claude-proxy-server --locked remote_database_roundtrips -- --ignored
        env:
          PROXY_TEST_POSTGRES: postgres://postgres:test-only@127.0.0.1:5432/proxy
          PROXY_TEST_MYSQL: mysql://root:test-only@127.0.0.1:3306/proxy
  docker:
    name: Docker build and health checks
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Build and start server
        run: docker compose up -d --build --wait
      - name: Check health and administration endpoints
        run: |
          curl --fail http://127.0.0.1:10800/health
          curl --fail http://127.0.0.1:10800/api/status
      - name: Show container logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Remove disposable containers and volumes
        if: always()
        run: docker compose down -v
