name: Native binaries
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            os: linux
            arch: x86_64
          - runner: ubuntu-24.04-arm
            os: linux
            arch: aarch64
          - runner: windows-latest
            os: windows
            arch: x86_64
          - runner: windows-11-arm
            os: windows
            arch: aarch64
          - runner: macos-15-intel
            os: macos
            arch: x86_64
          - runner: macos-latest
            os: macos
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.96.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --release --locked
      - name: Package CLI + server and standalone server with checksums
        shell: bash
        env:
          PLATFORM_OS: ${{ matrix.os }}
          PLATFORM_ARCH: ${{ matrix.arch }}
        run: |
          python scripts/package_release.py "$PLATFORM_OS" "$PLATFORM_ARCH"
      - uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/*
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/*
          draft: true
